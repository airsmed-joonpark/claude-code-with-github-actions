name: "Step 7 - CI Auto-fix"

# When "Step 7 - CI Tests" fails on a push to a feature branch (never the default branch),
# Claude reads the failed job log, fixes the source (never the tests) and pushes
# a commit to the same branch. That push re-runs the tests.
#
# Loop guards
#   1. Trigger scope: only workflow_run of "Step 7 - CI Tests", conclusion == failure,
#      event == push, same repository, and not the default branch.
#   2. Attempt cap: every autofix commit carries an "Autofix-Attempt: N" line.
#      The job counts those commits on the branch (git log --grep) and stops at MAX_ATTEMPTS.
#   3. Stale guard: skip if the branch moved since the failing run (a human pushed).
#   4. concurrency: one autofix per branch at a time.
#   5. Test-tampering guard: settings deny Edit/Write on test files, and a
#      post-check fails the job if the pushed commit touched demo_app/test_*.py.
#
# workflow_run workflows only fire from the default branch, so this file must live on main.

on:
  workflow_run:
    workflows: ["Step 7 - CI Tests"]
    types: [completed]

concurrency:
  group: step7-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write

env:
  MAX_ATTEMPTS: "2"

jobs:
  autofix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Guards (stale branch, attempt cap)
        id: guard
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current=$(git rev-parse HEAD)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "Branch moved since the failing run ($HEAD_SHA -> $current). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Count with --grep, not %(trailers): the action appends a Co-Authored-By
          # paragraph after Claude's message, so git no longer parses Autofix-Attempt
          # as a trailer and %(trailers) returns 0 (observed while building this step).
          attempts=$(git log "origin/$DEFAULT_BRANCH..HEAD" --grep='^Autofix-Attempt:' --format=%h | wc -l | tr -d ' ')
          echo "previous autofix attempts on this branch: $attempts (max $MAX_ATTEMPTS)"
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            echo "Attempt cap reached. Leaving the branch for a human."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next=$((attempts + 1))" >> "$GITHUB_OUTPUT"

      - name: Collect failed job log
        if: steps.guard.outputs.skip == 'false'
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed \
            | sed -E 's/\x1b\[[0-9;]*m//g; s/^[^\t]*\t[^\t]*\t[0-9TZ:.-]+ //' \
            | tail -n 120 > "$RUNNER_TEMP/failed.log"
          wc -l "$RUNNER_TEMP/failed.log"
          {
            echo "log<<FAILED_LOG_EOF"
            cat "$RUNNER_TEMP/failed.log"
            echo "FAILED_LOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.12"
      - name: Install pytest
        if: steps.guard.outputs.skip == 'false'
        run: python -m pip install --quiet pytest

      - name: Claude fixes the code
        if: steps.guard.outputs.skip == 'false'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "permissions": {
                "deny": [
                  "Edit(demo_app/test_*.py)",
                  "Write(demo_app/test_*.py)",
                  "Bash(git push --force:*)",
                  "Bash(git push -f:*)"
                ]
              }
            }
          claude_args: >-
            --max-turns 20
            --max-budget-usd 1
            --allowedTools "Read,Edit,Glob,Grep,Bash(python -m pytest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*)"
          prompt: |
            The CI workflow "Step 7 - CI Tests" failed on branch `${{ github.event.workflow_run.head_branch }}`
            (run ${{ github.event.workflow_run.html_url }}). The failing job's log tail is below.

            <failed_log>
            ${{ steps.logs.outputs.log }}
            </failed_log>

            Your job:
            1. Find the root cause in the source under demo_app/. Fix the CODE, not the tests.
               Files named demo_app/test_*.py are the specification and must not be changed.
            2. Run `python -m pytest demo_app -q` and make sure it passes.
            3. Commit only the source change with this exact message format:

               fix(demo_app): <one-line summary>

               <two or three lines: root cause and fix>

               Autofix-Attempt: ${{ steps.guard.outputs.next }}

            4. Push with `git push origin HEAD:${{ github.event.workflow_run.head_branch }}` (no force push).
            If you cannot fix it without touching tests, do not commit; explain why instead.

      - name: Post-check (tests untouched, commit pushed)
        if: steps.guard.outputs.skip == 'false'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git fetch -q origin "$BRANCH"
          new=$(git rev-parse "origin/$BRANCH")
          echo "branch head: $HEAD_SHA -> $new"
          if [ "$new" = "$HEAD_SHA" ]; then
            echo "::warning::Claude did not push a fix."; exit 0
          fi
          git diff --name-only "$HEAD_SHA" "$new" | tee "$RUNNER_TEMP/changed.txt"
          if grep -E '(^|/)test_[^/]*\.py$' "$RUNNER_TEMP/changed.txt"; then
            echo "::error::Autofix commit modified test files."; exit 1
          fi
          {
            echo "## Step 7 - CI Auto-fix"
            echo "- failing run: ${{ github.event.workflow_run.html_url }}"
            echo "- pushed: \`$new\` (attempt ${{ steps.guard.outputs.next }})"
            echo "- changed files:"; sed 's/^/  - /' "$RUNNER_TEMP/changed.txt"
            echo; git log -1 --format='```%n%B```' "$new"
          } >> "$GITHUB_STEP_SUMMARY"

      # Run report: model, turns, cost, tools called -> job summary + artifact
      - name: Claude run report
        if: always() && steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/claude-run-report
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          name: step7
