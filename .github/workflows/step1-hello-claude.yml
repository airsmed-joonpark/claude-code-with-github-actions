name: "Step 1 - Hello Claude"

# IMPORTANT: Before running, install the Claude Code GitHub App:
# https://github.com/apps/claude

# The simplest possible Claude Code workflow.
# Add your CLAUDE_CODE_OAUTH_TOKEN secret, then either:
#   - run it from the Actions tab (Claude analyzes the repo, result appears in the run summary), or
#   - mention @claude in an issue, issue comment, or PR review comment (Claude replies in the thread).

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

  # Respond when someone mentions @claude in an issue or PR comment
  issue_comment:
    types: [created]

  # Respond to PR review comments
  pull_request_review_comment:
    types: [created]

  # Respond when a new issue mentioning @claude is opened
  issues:
    types: [opened]

jobs:
  hello-claude:
    # Run on manual trigger, or when @claude is mentioned by someone with write access.
    # The author_association check keeps outsiders on a public repo from starting runs at all.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20   # last-resort cap; a cancelled job leaves no run report
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Manual run: a fixed prompt (agent mode). The answer is shown in the run's Summary page.
      - name: Run Claude Code (manual)
        id: claude_manual
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cost guards: stop after N turns or about $X (checked after each turn)
          claude_args: "--dangerously-skip-permissions --max-turns 15 --max-budget-usd 1"
          display_report: "true"
          prompt: |
            Analyze this repository structure and suggest improvements.
            Be concise and helpful.

      # @claude mention: no prompt input, so the action uses tag mode.
      # Claude reads the issue/comment text and replies in the same thread.
      # (Setting `prompt:` here would force agent mode and Claude would ignore the comment.)
      - name: Run Claude Code (@claude mention)
        id: claude_mention
        if: github.event_name != 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--dangerously-skip-permissions --max-turns 30 --max-budget-usd 2"

      # Run report: model, turns, cost, tools called, denials -> job summary + artifact
      - name: Claude run report
        if: always()
        uses: ./.github/actions/claude-run-report
        with:
          execution_file: ${{ steps.claude_manual.outputs.execution_file || steps.claude_mention.outputs.execution_file }}
          name: step1

      - name: Generate Step Summary
        if: always()
        run: |
          echo "## Claude Code Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
