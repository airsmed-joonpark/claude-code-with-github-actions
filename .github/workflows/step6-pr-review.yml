name: "Step 6 - PR Auto Review"

# Automatic code review on every pull request from someone with write access.
# Claude posts inline comments on the exact lines (with ```suggestion blocks) and keeps one
# summary comment that is updated on every new push (use_sticky_comment + track_progress).
# Fork PRs do not get repository secrets, so they are skipped.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: step6-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          # With an OAuth token the inline-comment classifier is skipped, so the prompt asks for confirmed: true.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT ACTION: ${{ github.event.action }}

            Review this pull request for correctness bugs and security issues.

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` and `gh pr view ${{ github.event.pull_request.number }} --comments`
               to see the current diff and any earlier review comments. Read changed files with Read/Grep for context.
            2. For every concrete bug, post ONE inline comment with
               mcp__github_inline_comment__create_inline_comment on the exact line in the NEW version of the file
               (side RIGHT). Pass confirmed: true. Say what breaks, a concrete failing input, and the fix
               (use a ```suggestion block when the fix is a small line edit).
            3. If this is a re-review (EVENT ACTION = synchronize): do NOT re-flag issues that the latest
               commit already fixed, and do NOT duplicate an inline comment that already exists on the same issue.
               In the summary, list which earlier findings are now resolved.
            4. Put the summary (findings table: file:line, severity, status new/still-open/resolved) in your
               tracking comment. Keep it under 30 lines. No praise, no style nits.
          claude_args: |
            --model sonnet
            --max-turns 30
            --max-budget-usd 2
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # Run report: model, turns, cost, tools called -> job summary + artifact
      - name: Claude run report
        if: always()
        uses: ./.github/actions/claude-run-report
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          name: step6
