name: "ADV - PR Auto Review"

# Advanced test: automatic PR code review with inline comments + sticky progress comment.
# Fires ONLY for PRs whose head branch starts with "adv-review/".
# Option toggles via PR labels (set at PR creation):
#   adv-review:nofix        -> include_fix_links: false
#   adv-review:noclassify   -> classify_inline_comments: false
#   adv-review:unconfirmed  -> prompt tells Claude to omit `confirmed` (exercises the buffer/classifier)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: adv-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: startsWith(github.head_ref, 'adv-review/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          include_fix_links: ${{ !contains(github.event.pull_request.labels.*.name, 'adv-review:nofix') }}
          classify_inline_comments: ${{ !contains(github.event.pull_request.labels.*.name, 'adv-review:noclassify') }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT ACTION: ${{ github.event.action }}

            Review this pull request for correctness bugs and security issues.

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` and `gh pr view ${{ github.event.pull_request.number }} --comments`
               to see the current diff and any earlier review comments. Read changed files with Read/Grep for context.
            2. For every concrete bug, post ONE inline comment with
               mcp__github_inline_comment__create_inline_comment on the exact line in the NEW version of the file
               (side RIGHT). ${{ contains(github.event.pull_request.labels.*.name, 'adv-review:unconfirmed') && 'Do NOT pass the confirmed parameter at all.' || 'Pass confirmed: true.' }} Say what breaks, a concrete failing input, and the fix
               (use a ```suggestion block when the fix is a small line edit).
            3. If this is a re-review (EVENT ACTION = synchronize): do NOT re-flag issues that the latest
               commit already fixed, and do NOT duplicate an inline comment that already exists on the same issue.
               In the summary, list which earlier findings are now resolved.
            4. Put the summary (findings table: file:line, severity, status new/still-open/resolved) in your
               tracking comment. Keep it under 30 lines. No praise, no style nits.
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: Upload execution file
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: adv-pr-review-exec-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7

      - name: Cost summary
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          COST=$(jq -r '[.[] | select(.type=="result")] | last | .total_cost_usd // "n/a"' "$EXEC" 2>/dev/null || echo n/a)
          TURNS=$(jq -r '[.[] | select(.type=="result")] | last | .num_turns // "n/a"' "$EXEC" 2>/dev/null || echo n/a)
          echo "total_cost_usd=$COST num_turns=$TURNS"
          echo "### PR review: cost \$${COST}, turns ${TURNS}" >> "$GITHUB_STEP_SUMMARY"
