name: Daily News Digest

on:
  schedule:
    # Run daily at 8 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Claude Code CLI reads this token (issue one with `claude setup-token`)
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout Repository ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install Claude Code ──────────────────────────────
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # ── 4. Setup Chrome ────────────────────────────────────
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Launch Chrome with Remote Debugging
        run: |
          chrome \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --remote-debugging-port=9222 \
            --window-size=1920,1080 \
            &
          # Wait for Chrome to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:9222/json/version > /dev/null 2>&1; then
              echo "Chrome is ready"
              break
            fi
            sleep 1
          done

      # ── MCP servers ────────────────────────────────────────
      # Packages are fetched by npx at start-up. The config file is passed to
      # claude with --mcp-config (a file under ~/.claude is not picked up).
      # For web fetching, Claude's built-in WebFetch tool is used instead of a fetch MCP server.
      - name: Configure MCP Servers
        run: |
          cat > "$RUNNER_TEMP/mcp-config.json" << 'EOF'
          {
            "mcpServers": {
              "sequential-thinking": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
              },
              "chrome-devtools": {
                "command": "npx",
                "args": ["-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222"]
              }
            }
          }
          EOF
          cat "$RUNNER_TEMP/mcp-config.json"

      # ── 7. Run Claude Code ─────────────────────────────────
      - name: Generate News Digest
        run: |
          DATE=$(date -u +%Y-%m-%d)

          claude -p \
            --dangerously-skip-permissions \
            --output-format json \
            --max-turns 40 \
            --max-budget-usd 2 \
            --mcp-config "$RUNNER_TEMP/mcp-config.json" \
            --allowedTools "mcp__chrome-devtools__*,mcp__sequential-thinking__*,WebFetch,WebSearch,Read,Write,Bash,Glob,Grep" \
            --agent news-curator \
            "Today is ${DATE}. Generate a daily tech news digest.

            ## Instructions

            1. **Check for duplicates**: Run the duplicate checker script:
               \`python3 .claude/skills/news-digest-generator/scripts/check_duplicates.py output/\`

            2. **Visit Hacker News** (https://news.ycombinator.com):
               - Use chrome-devtools to navigate and take a snapshot
               - Extract the top 15 headlines with URLs and point counts
               - Take a screenshot and save to output/screenshots/${DATE}-hn.png

            3. **Visit TechCrunch** (https://techcrunch.com):
               - Use chrome-devtools to navigate and take a snapshot
               - Extract the top 10 headlines with URLs and authors
               - Take a screenshot and save to output/screenshots/${DATE}-tc.png

            4. **Analyze and Generate Digest**:
               - Use sequential-thinking to identify 3-5 emerging trends
               - Cross-reference stories between sources
               - Categorize stories (AI, Web, Security, Startups, etc.)

            5. **Write Output**:
               - Read the template from .claude/skills/news-digest-generator/assets/template.md
               - Generate the digest following the template format
               - Save to output/${DATE}-digest.md

            6. **Quality Check**:
               - Verify all URLs are valid
               - Ensure no duplicate headlines from previous digests
               - Confirm the digest has at least 15 stories total" > "$RUNNER_TEMP/claude-result.json"
          jq -r .result "$RUNNER_TEMP/claude-result.json"

      # ── Run record ─────────────────────────────────────────
      # The JSON result has the stop reason, turns, cost and permission denials.
      - name: Upload Claude result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-result
          path: ${{ runner.temp }}/claude-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Run report
        if: always()
        run: |
          F="$RUNNER_TEMP/claude-result.json"
          [ -f "$F" ] || { echo "No Claude result file." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          jq -r '"### Claude run report",
                 "| item | value |", "|---|---|",
                 "| stop reason | \(.subtype) |",
                 "| turns | \(.num_turns) |",
                 "| cost (USD) | \(.total_cost_usd) |",
                 "| models used | \((.modelUsage // {}) | keys | join(", ")) |",
                 "| permission denials | \((.permission_denials // []) | length) |"' "$F" >> "$GITHUB_STEP_SUMMARY"

      # ── 8. Commit and Push ─────────────────────────────────
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: add daily news digest for ${DATE}"
            git push
          fi
